name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DDNS-Updater.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DDNS Updater, сборка ${{ github.run_number }}
          files: DDNS-Updater.apk
          make_latest: true

      # Если сборка упала — кладём хвост лога в ветку ci-log, чтобы его можно было прочитать без входа в Actions
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -f build.log ]; then tail -n 400 build.log > /tmp/ci-build.log; else echo "build.log not found" > /tmp/ci-build.log; fi
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/ci-build.log ci-build.log
          git add -f ci-build.log
          git commit -m "Build log, run ${{ github.run_number }}"
          git push -f origin ci-log
